# Render Blueprint for the public demo. In the Render Dashboard: New -> Blueprint,
# connect this repository, then fill in the two secrets it asks for.
# See docs/27-hosted-demo.md.
services:
  - type: web
    name: ai-data-enrichment-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      # Shared code every visitor must enter. At least 8 characters, no spaces.
      - key: ENRICHMENT_ACCESS_CODE
        sync: false
      # Used only on the server for planning; never sent to the browser.
      - key: OPENAI_API_KEY
        sync: false
      # Measured for planning in docs/26-live-planning-reliability.md.
      - key: OPENAI_MODEL
        value: gpt-6-luna
      # Server network gate; each run still needs the visitor's own consent.
      - key: ENRICHMENT_ALLOW_NETWORK
        value: "1"
