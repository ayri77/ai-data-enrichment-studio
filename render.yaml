# Render Blueprint for the public demo. In the Render Dashboard: New -> Blueprint,
# connect this repository, then fill in the two secrets it asks for.
# See docs/27-hosted-demo.md.
services:
  - type: web
    name: ai-data-enrichment-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      # One code per visitor: label:code entries separated by commas. Print
      # them with `python -m scripts.make_access_codes` (docs/27-hosted-demo.md).
      - key: ENRICHMENT_ACCESS_CODES
        sync: false
      # One more code, counted as "shared". At least 8 characters, no spaces.
      - key: ENRICHMENT_ACCESS_CODE
        sync: false
      # Opens the usage summary at /#usage and nothing else. At least 12 characters.
      - key: ENRICHMENT_ADMIN_CODE
        sync: false
      # Used only on the server for planning; never sent to the browser.
      - key: OPENAI_API_KEY
        sync: false
      # Measured for planning in docs/26-live-planning-reliability.md.
      - key: OPENAI_MODEL
        value: gpt-6-luna
      # Optional: offers the driving distance by road. Leave it empty until the
      # planner was measured with it (docs/30-road-distance-and-ratio.md).
      - key: OPENROUTESERVICE_API_KEY
        sync: false
      # Server network gate; each run still needs the visitor's own consent.
      - key: ENRICHMENT_ALLOW_NETWORK
        value: "1"
