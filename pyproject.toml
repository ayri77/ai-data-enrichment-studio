[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-data-enrichment-studio"
version = "0.1.0"
description = "Evidence-driven agentic data enrichment for structured datasets"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1,<4",
    "pydantic>=2.10,<3",
    "typer>=0.15,<1",
]

[project.scripts]
enrichment = "ai_data_enrichment.cli:app"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "pyright>=1.1.400,<2",
    "ruff>=0.13,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_data_enrichment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: tests across package boundaries"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = "none"
